name: API Tests

on:
  push:
    branches: [main, develop, claude/**]
    paths:
      - 'apps/api/**'
      - 'packages/ml/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'packages/ml/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    name: Test API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']
      fail-fast: false

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentiment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: apps/api/.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('apps/api/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: apps/api
        run: poetry install --no-interaction --no-root

      - name: Install scikit-learn and ML dependencies
        working-directory: apps/api
        run: poetry add scikit-learn joblib numpy --no-interaction

      - name: Install project
        working-directory: apps/api
        run: poetry install --no-interaction

      - name: Run linting (ruff)
        working-directory: apps/api
        run: |
          poetry run pip install ruff
          poetry run ruff check . || true

      - name: Run type checking (mypy)
        working-directory: apps/api
        run: |
          poetry run pip install mypy
          poetry run mypy . --ignore-missing-imports || true

      - name: Run unit tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_test
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          poetry run pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_test
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          poetry run pytest tests/integration/ -v --tb=short

      - name: Run worker tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_test
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          poetry run pytest tests/test_workers.py -v --tb=short

      - name: Run all tests with coverage
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_test
          REDIS_URL: redis://localhost:6379
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          poetry run pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: apps/api/coverage.xml
          flags: api
          name: api-coverage
          fail_ci_if_error: false

      - name: Check code formatting (black)
        working-directory: apps/api
        run: |
          poetry run pip install black
          poetry run black --check . || true

      - name: Security scan (bandit)
        working-directory: apps/api
        run: |
          poetry run pip install bandit
          poetry run bandit -r . -ll || true

  ml-package-test:
    name: Test ML Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install scikit-learn joblib numpy pytest

      - name: Test ML imports
        run: |
          cd packages/ml
          python -c "from trainer import ModelTrainer; print('✓ Trainer imported')"
          python -c "from predictor import SentimentPredictor; print('✓ Predictor imported')"
          python -c "from evaluator import ModelEvaluator; print('✓ Evaluator imported')"
          python -c "from preprocessor import TextPreprocessor; print('✓ Preprocessor imported')"

      - name: Test basic ML functionality
        run: |
          cd packages/ml
          python -c "
          from trainer import ModelTrainer
          from predictor import SentimentPredictor
          from preprocessor import TextPreprocessor

          # Test preprocessing
          preprocessor = TextPreprocessor()
          text = preprocessor.preprocess('Test http://example.com')
          print(f'✓ Preprocessing works: {text}')

          # Test training
          trainer = ModelTrainer(max_features=100)
          texts = ['great'] * 10 + ['bad'] * 10 + ['okay'] * 10
          labels = ['positive'] * 10 + ['negative'] * 10 + ['neutral'] * 10
          model, vectorizer, metrics = trainer.train(texts, labels)
          print(f'✓ Training works. F1: {metrics[\"f1_macro\"]:.3f}')

          # Test saving
          import tempfile
          import os
          with tempfile.TemporaryDirectory() as tmpdir:
              path = os.path.join(tmpdir, 'test_model.joblib')
              trainer.save_model(model, vectorizer, path)
              print(f'✓ Model saved')

              # Test loading and prediction
              predictor = SentimentPredictor(path)
              result = predictor.predict('great product')
              print(f'✓ Prediction works: {result[\"predicted_label\"]}')
          "
