version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: audio-translator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator_password
      POSTGRES_DB: audio_translator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d audio_translator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
